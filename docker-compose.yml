version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: nexora-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexora_db_password_production
      POSTGRES_DB: nexora
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Caching Service (Redis)
  redis:
    image: redis:7-alpine
    container_name: nexora-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  # Web Service (Next.js Node application)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexora-web
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:nexora_db_password_production@db:5432/nexora?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"

  # Web Server & Reverse Proxy (NGINX)
  nginx:
    image: nginx:alpine
    container_name: nexora-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      - web

  # Telemetry Metrics Scraper (Prometheus)
  prometheus:
    image: prom/prometheus
    container_name: nexora-prometheus
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"

  # Metrics Dashboards (Grafana)
  grafana:
    image: grafana/grafana
    container_name: nexora-grafana
    restart: always
    ports:
      - "3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  certs:
  promdata:
  grafanadata:
